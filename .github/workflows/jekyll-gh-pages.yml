name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly check

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run model tests
      run: |
        python test_model.py
    
    - name: Test Flask app startup
      run: |
        python -c "from app import app; app.config['TESTING'] = True; client = app.test_client(); response = client.get('/'); print(f'App status: {response.status_code}')"
    
    - name: Generate coverage report
      run: |
        pytest --cov=. --cov-report=xml --cov-report=term-missing 2>/dev/null || true
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        pip install bandit safety
    
    - name: Run Bandit security scan
      run: |
        bandit -r . -ll -f json -o bandit-report.json || true
    
    - name: Check for vulnerable dependencies
      run: |
        safety check --file requirements.txt --json || true

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build application
      run: |
        echo "Building Liver Disease Prediction System..."
        mkdir -p build
        cp app.py build/
        cp -r templates build/
        cp -r static build/
        cp requirements.txt build/
        echo "Build complete!"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: liver-prediction-app
        path: build/
        retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy notification
      run: |
        echo "🚀 Deployment pipeline ready"
        echo "Configure deployment secrets (DEPLOY_KEY, DEPLOY_URL) to enable automatic deployment"
        echo "Supported platforms: Heroku, Azure, AWS, DigitalOcean"
    
    # Example Heroku deployment (uncomment and configure):
    # - name: Deploy to Heroku
    #   env:
    #     HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    #   run: |
    #     npm install -g heroku
    #     heroku login --api-key
    #     heroku git:remote -a your-app-name
    #     git push heroku main

  health-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Weekly model integrity check
      run: |
        python test_model.py
        echo "✓ Model integrity verified"
    
    - name: Check for dependency updates
      run: |
        pip list --outdated || echo "All dependencies up to date"
