name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly check

jobs:
  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        pip install bandit safety
    
    - name: Run Bandit security scan
      run: |
        bandit -r . -ll -f json -o bandit-report.json || true
    
    - name: Check for vulnerable dependencies
      run: |
        safety check --file requirements.txt --json || true

  build:
    needs: [security]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build application
      run: |
        echo "Building Liver Disease Prediction System..."
        mkdir -p build
        cp app.py build/
        cp -r templates build/
        cp -r static build/
        cp requirements.txt build/
        echo "Build complete!"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: liver-prediction-app
        path: build/
        retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy notification
      run: |
        echo "🚀 Deployment pipeline ready"
        echo "Configure deployment secrets (DEPLOY_KEY, DEPLOY_URL) to enable automatic deployment"
        echo "Supported platforms: Heroku, Azure, AWS, DigitalOcean"
    
    # Example Heroku deployment (uncomment and configure):
    # - name: Deploy to Heroku
    #   env:
    #     HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    #   run: |
    #     npm install -g heroku
    #     heroku login --api-key
    #     heroku git:remote -a your-app-name
    #     git push heroku main

  health-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Weekly model integrity check
      run: |
        python test_model.py
        echo "✓ Model integrity verified"
    
    - name: Check for dependency updates
      run: |
        pip list --outdated || echo "All dependencies up to date"
